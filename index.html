<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDX Research Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{
 --bg:#0b0f14; --bg2:#111720; --pn:#151d28; --pn2:#1b2532; --ln:#232f3e; --ln2:#2e3d50;
 --tx:#e2e9f1; --t2:#8fa0b4; --t3:#5d6d80;
 --up:#35b88a; --upbg:rgba(53,184,138,.13); --dn:#e3695f; --dnbg:rgba(227,105,95,.13);
 --ac:#e0a13c; --acbg:rgba(224,161,60,.13); --bl:#6fa4e0; --blbg:rgba(111,164,224,.13);
 --vi:#a487d6;
}
:root[data-theme="light"]{
 --bg:#f4f6f9; --bg2:#eaeef3; --pn:#fff; --pn2:#f5f8fa; --ln:#d9e0e8; --ln2:#c2ccd8;
 --tx:#16202c; --t2:#546475; --t3:#8494a6;
 --up:#158a61; --upbg:rgba(21,138,97,.10); --dn:#c0392f; --dnbg:rgba(192,57,47,.10);
 --ac:#9a6a12; --acbg:rgba(154,106,18,.12); --bl:#2f6cab; --blbg:rgba(47,108,171,.10);
 --vi:#6f4fa8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;font-size:13px;line-height:1.45;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden}
.mo,.n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--t2)}.mu{color:var(--t2)}.fa{color:var(--t3)}.ac{color:var(--ac)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--tx);background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:5px 8px;font-size:12px}
textarea{font-size:12.5px;line-height:1.6;resize:vertical;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--ln2);border-radius:5px}::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:180px 1fr;grid-template-rows:48px 1fr;height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:baseline;gap:9px}
.brand b{font-size:14.5px;font-weight:700;letter-spacing:.03em}
.brand s{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.16em;text-decoration:none}
.mode{font-size:9.5px;font-weight:700;letter-spacing:.11em;padding:3px 8px;border-radius:3px;text-transform:uppercase;cursor:help}
.mode.demo{background:var(--acbg);color:var(--ac);border:1px solid var(--ac)}
.mode.live{background:var(--upbg);color:var(--up);border:1px solid var(--up)}
.tick{overflow:hidden;flex:1;mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 2%,#000 98%,transparent)}
.tickin{display:inline-flex;white-space:nowrap;animation:tkscroll linear infinite;will-change:transform}
.tick:hover .tickin{animation-play-state:paused}
@keyframes tkscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick .half{display:inline-flex;gap:22px;padding-right:22px}
.tick .ti{display:inline-flex;gap:5px;align-items:baseline;white-space:nowrap;font-size:11.5px}
.tick .ti b{font-weight:600;font-size:11px;letter-spacing:.02em}
.sp{flex:1}
#top .btn{border:1px solid var(--ln);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--t2)}
#top .btn:hover{color:var(--tx);border-color:var(--ln2)}
.asof{font-size:10.5px;color:var(--t3);text-align:right;line-height:1.3}

#nav{background:var(--bg2);border-right:1px solid var(--ln);padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:5px;color:var(--t2);font-size:12.5px;font-weight:500;width:100%;text-align:left}
.nv i{font-style:normal;font-family:'IBM Plex Mono';font-size:10px;color:var(--t3);width:12px}
.nv:hover{background:var(--pn);color:var(--tx)}
.nv.on{background:var(--pn2);color:var(--tx);box-shadow:inset 2px 0 0 var(--ac)}
.nvnote{margin-top:auto;font-size:10px;color:var(--t3);line-height:1.6;padding:10px 8px;border-top:1px solid var(--ln)}

#main{overflow-y:auto;padding:16px 18px 40px}
.pg{display:none}.pg.on{display:block}
.hd{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hd h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.hd .sub{font-size:11.5px;color:var(--t3)}
.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.g{display:grid;gap:11px}
.pnl{background:var(--pn);border:1px solid var(--ln);border-radius:7px}
.ph{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--ln)}
.ph h3{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t2)}
.ph .s{margin-left:auto;font-size:10px;color:var(--t3)}
.pb{padding:12px 13px}.pb.t{padding:0}
.cbox{position:relative;height:240px;padding:8px 10px 4px}
.cbox.sm{height:160px}.cbox.lg{height:320px}

.kc{background:var(--pn);border:1px solid var(--ln);border-radius:7px;padding:10px 13px}
.kc .l{font-size:9.5px;color:var(--t2);text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:5px}
.kc .v{font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.kc .s{font-size:11px;margin-top:2px;color:var(--t2)}
.q{color:var(--t3);cursor:help;font-size:9px;border:1px solid var(--ln2);border-radius:50%;width:13px;height:13px;line-height:12px;text-align:center;display:inline-block;flex:none}

table.t{width:100%;border-collapse:collapse;font-size:11.5px}
table.t th{position:sticky;top:0;background:var(--pn2);color:var(--t2);font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;text-align:right;padding:7px 9px;border-bottom:1px solid var(--ln);white-space:nowrap;z-index:2;cursor:pointer;user-select:none}
table.t th:hover{color:var(--tx)}
table.t th.l,table.t td.l{text-align:left}
table.t th.srt{color:var(--ac)}
table.t td{padding:6px 9px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
table.t tbody tr:hover{background:var(--pn2)}
table.t tbody tr.ck{cursor:pointer}
.tw{overflow:auto;max-height:560px}
.tk{font-weight:700;color:var(--bl);cursor:pointer}
.bg{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:3px;padding:2px 6px}
.b-up{background:var(--upbg);color:var(--up)}.b-dn{background:var(--dnbg);color:var(--dn)}
.b-ac{background:var(--acbg);color:var(--ac)}.b-mu{background:var(--pn2);color:var(--t2);border:1px solid var(--ln)}
.b-bl{background:var(--blbg);color:var(--bl)}

.bar{height:5px;background:var(--pn2);border-radius:3px;overflow:hidden;min-width:44px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;border-radius:3px}
.sc{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.sc .n{width:22px;text-align:right;font-size:11px}

.fb{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.fb label{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.07em}
.seg{display:flex;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.seg button{padding:4px 10px;font-size:11px;color:var(--t2);border-right:1px solid var(--ln)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--pn2);color:var(--tx);font-weight:600}

.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.kv .k{color:var(--t2)}.kv .v{text-align:right}
.st{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--ln);font-size:12px}
.st:last-child{border-bottom:none}.st .k{color:var(--t2)}
.sect{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--t3);margin:16px 0 7px}
.sect:first-child{margin-top:0}
.fm{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--t2);background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:7px 10px;line-height:1.6}
.nt{font-size:10.5px;color:var(--t3);line-height:1.6}
.warn{border:1px solid var(--ac);background:var(--acbg);color:var(--ac);border-radius:5px;padding:9px 11px;font-size:11px;line-height:1.6}

.hm{display:grid;gap:2px;font-family:'IBM Plex Mono';font-size:10.5px}
.hm .hc{padding:6px 4px;text-align:center;border-radius:2px}
.hm .hl{padding:6px 7px;text-align:left;color:var(--t2);font-family:Inter;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm .hh{padding:4px;text-align:center;color:var(--t3);font-size:9px;text-transform:uppercase;font-family:Inter;letter-spacing:.06em}

/* sensitivity grid — the signature element */
.sg{display:grid;gap:3px;font-family:'IBM Plex Mono';font-size:11px}
.sg .c{padding:9px 6px;text-align:center;border-radius:3px;border:1px solid transparent;line-height:1.35}
.sg .c b{display:block;font-size:12px;font-weight:600}
.sg .c s{display:block;font-size:9.5px;text-decoration:none;opacity:.75}
.sg .c.base{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.sg .ax{padding:6px 4px;text-align:center;color:var(--t3);font-size:9px;text-transform:uppercase;font-family:Inter;letter-spacing:.06em}

/* news */
.nw{display:flex;gap:11px;padding:10px 13px;border-bottom:1px solid var(--ln);align-items:flex-start}
.nw:last-child{border-bottom:none}
.nw .dt{flex:none;width:52px;font-size:10px;color:var(--t3);font-family:'IBM Plex Mono';padding-top:2px}
.nw .bd{flex:1}
.nw .bd .h{font-size:12.5px;line-height:1.5;color:var(--tx)}
.nw .bd .m{font-size:10px;color:var(--t3);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nw a{color:inherit;text-decoration:none}.nw a:hover .h{color:var(--bl)}
.chip{font-size:9.5px;font-weight:600;color:var(--bl);background:var(--blbg);border-radius:3px;padding:1px 5px;cursor:pointer}

#dw{position:fixed;top:48px;right:-680px;width:660px;bottom:0;background:var(--pn);border-left:1px solid var(--ln2);box-shadow:-10px 0 30px rgba(0,0,0,.4);transition:right .2s ease;z-index:60;display:flex;flex-direction:column}
#dw.open{right:0}
#dw .dh{display:flex;align-items:center;gap:11px;padding:13px 17px;border-bottom:1px solid var(--ln)}
#dw .dh h2{font-size:15px}
#dw .db{overflow-y:auto;padding:15px 17px 40px;flex:1}
#dwX{margin-left:auto;font-size:17px;color:var(--t2);padding:2px 8px}
.tb2{display:flex;gap:2px;border-bottom:1px solid var(--ln);margin-bottom:12px}
.tb2 button{padding:7px 13px;font-size:11.5px;color:var(--t2);border-bottom:2px solid transparent}
.tb2 button.on{color:var(--tx);border-bottom-color:var(--ac);font-weight:600}

.sl{display:flex;align-items:center;gap:9px;margin:7px 0}
.sl label{font-size:11px;color:var(--t2);width:118px;flex:none}
.sl input[type=range]{flex:1;accent-color:var(--ac);background:none;border:none;padding:0}
.sl .vv{width:56px;text-align:right;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--tx)}

@media(max-width:1150px){#app{grid-template-columns:52px 1fr}.nv span{display:none}.nvnote{display:none}}
</style>

    const al=(s.dr-s.beta*.08)/252;
    const r=Array.from({length:N},(_,i)=>al+s.beta*rm[i]+idio*gauss(rng));
    const raw=[s.p0];for(let i=1;i<N;i++)raw.push(raw[i-1]*(1+r[i]));
    const f=Math.pow(s.p0/raw[N-1],1/(N-1));       // pin end to stated price
    PX[t]=raw.map((v,i)=>roundTick(v*Math.pow(f,i)));
    RET[t]=PX[t].map((v,i)=>i?v/PX[t][i-1]-1:0);

  MKT.ff=rm.map((r,i)=>i?Math.round((r*88000+.3*gauss(rng))*1e9):0);

function hi52(t){return Math.max(...PX[t].slice(Math.max(0,LAST-252)))}
function lo52(t){return Math.min(...PX[t].slice(Math.max(0,LAST-252)))}

  const m=r.reduce((a,b)=>a+b,0)/r.length;

function applyRealData(j){
  if(!j||!j.prices)throw new Error('This file has no price data.');
  const dates=j.dates;
  if(!Array.isArray(dates)||dates.length<30)throw new Error('This file has no usable trading calendar.');

  /* User-added tickers (my_stocks.txt): create universe entries for names the
     payload carries that the built-in universe does not, provided the fetch
     found a name and share count. Missing fields default conservatively and
     the entry is marked custom. */
  if(j.fundamentals)for(const tk in j.fundamentals){
    if(!U[tk]){const f=j.fundamentals[tk];
      if(f&&f.n&&f.sh&&j.prices&&Array.isArray(j.prices[tk]))
        U[tk]={n:f.n,s:f.s||'Other',sub:f.sub||'—',p0:0,beta:f.beta||1,vol:.3,dr:0,mcap:0,sh:f.sh,
          pe:f.pe||0,pb:f.pb||0,roe:f.roe||0,roa:0,dy:f.dy||0,payout:f.payout||0,de:f.de||0,
          rg:f.rg||0,eg:f.eg||0,om:0,nm:f.nm||0,fcf:f.fcf||0,ndE:f.ndE||0,cov:0,adv:f.adv||0,
          soe:0,q:50,note:'User-added via my_stocks.txt',custom:1};
    }
  }

  /* Only keep names with a full real price history over the new calendar.
     Padding a gap with synthetic prices, or leaving a stale series in place
     next to live ones, would silently corrupt every return and multiple on
     the screen. Dropping the name and saying so is the honest option.     */
  const keep=[],dropped=[];
  for(const tk of Object.keys(U)){
    const p=j.prices[tk];
    if(Array.isArray(p)&&p.length===dates.length&&p.every(v=>typeof v==='number'&&v>0))keep.push(tk);
    else dropped.push(tk);
  }
  if(keep.length<5)throw new Error('Only '+keep.length+' tickers had a complete price history — not enough to run the terminal.');

  DATES.length=0;dates.forEach(x=>DATES.push(x));
  N=DATES.length;LAST=N-1;
  for(const tk of keep){PX[tk]=j.prices[tk].slice();RET[tk]=PX[tk].map((v,i)=>i?v/PX[tk][i-1]-1:0);
    U[tk].p0=PX[tk][PX[tk].length-1]}   /* re-anchor per-share fundamentals to the real price */
  for(const tk of dropped){delete PX[tk];delete RET[tk];delete U[tk]}
  TICKERS=keep;
  SECTORS=[...new Set(TICKERS.map(t=>U[t].s))].sort();

  if(Array.isArray(j.ihsg)&&j.ihsg.length===N){
    MKT.IHSG=j.ihsg.slice();MKT.r=MKT.IHSG.map((v,i)=>i?v/MKT.IHSG[i-1]-1:0);
  }else{MKT.IHSG=null;MKT.r=null}
  /* LQ45 and foreign flow are synthetic constructs in the demo dataset and
     have no live equivalent here — remove them rather than show demo series
     beside real prices. */
  MKT.LQ45=null;MKT.rLQ=null;
  /* Foreign flow: only if the fetch found it (best-effort from the IDX daily
     trading summary); aligned to dates, null where a session is missing. */
  MKT.ff=(Array.isArray(j.ff)&&j.ff.length===dates.length)?j.ff.slice():null;

  if(j.fundamentals)for(const tk in j.fundamentals)if(U[tk])Object.assign(U[tk],j.fundamentals[tk]);
  if(Array.isArray(j.news)&&j.news.length)NEWS=j.news;
  if(Array.isArray(j.events)&&j.events.length)EVENTS=j.events;

  APP.dataMode='LIVE';APP.asof=j.asof||DATES[LAST];
  APP.source=j.source||'idx_data.json';APP.generated=j.generated||'';
  APP.loaded=keep.length;APP.dropped=dropped;
  if(typeof reinitFundamentals==='function')reinitFundamentals();
  return keep.length;
}

  try{
    if(typeof window!=='undefined'&&window.__IDX_DATA__){
      applyRealData(window.__IDX_DATA__);APP.embedded=true;return true}
  }catch(e){}
  try{
    const r=await fetch('idx_data.json',{cache:'no-store'});
    if(!r.ok)return false;
    applyRealData(await r.json());
    return true;
  }catch(e){return false}
}

/* =====================================================================
   Layer 2 — Valuation engine (pure functions, no DOM)
   Two-stage FCF DCF + reverse DCF + sensitivity grid.
   Every assumption is an explicit input. Nothing is hidden.
   ===================================================================== */

/* ---------------------------------------------------------------
   Derived, price-consistent fundamentals.
   Per-share anchors (EPS, BVPS, DPS) are fixed at the reference
   price; multiples then recompute from the live price, so the
   whole terminal stays consistent when real prices load.
   --------------------------------------------------------------- */
function reinitFundamentals(){
  for(const tk of TICKERS){const s=U[tk];
    s.eps  = s.pe>0 ? s.p0/s.pe : null;          // null = loss-making
    s.bvps = s.pb>0 ? s.p0/s.pb : null;
    s.dps  = s.p0*s.dy/100;
    s.ebitda = s.fcf>0 ? s.fcf/0.55 : 0;         // FCF ~55% of EBITDA after capex/tax/WC
    s.nd   = s.ebitda*(s.ndE||0);                // net debt, IDR bn (negative = net cash)
    s.isFin= s.s==='Financials';
  }
}
reinitFundamentals();
function mcapOf(tk){return px(tk,LAST)*U[tk].sh/1000}              // IDR bn
function peOf(tk){const s=U[tk];return s.eps?px(tk,LAST)/s.eps:0}
function pbOf(tk){const s=U[tk];return s.bvps?px(tk,LAST)/s.bvps:0}
function dyOf(tk){const s=U[tk];return s.dps/px(tk,LAST)*100}
function roeOf(tk){const s=U[tk];
  return (s.eps&&s.bvps)?s.eps/s.bvps*100:s.roe}                    // identity: ROE = P/B ÷ P/E

/* Default assumption set — visible and editable in the UI */
/* Assumptions are calibrated for IDR nominal cash flows, not USD.
   This matters: Indonesian nominal GDP growth runs near 8% (about 5%
   real plus 3% inflation), so a 4-5% terminal growth rate — normal in
   a developed market — implies perpetual real decline and will make
   every Indonesian company look expensive. Terminal growth must sit
   below nominal GDP, not below developed-market nominal GDP.        */
const VAL_DEFAULTS={
  rf:6.6,        // Indonesian 10Y government bond (SBN) yield, %
  erp:6,         // Indonesia equity risk premium, % (mature-market base + country risk)
  taxRate:22,    // Indonesian corporate tax rate, %
  costDebt:8.5,  // pre-tax cost of debt, %
  g1:8,          // stage-1 FCF growth, % p.a. (nominal)
  years:5,       // stage-1 length
  gT:5.5,        // terminal growth, nominal — below ~8% nominal GDP
  roeT:null,     // terminal sustainable ROE for banks (null = auto-derive)
  fadeYrs:12,    // years over which excess ROE decays
  gBank:7,       // terminal growth for banks — book compounds with nominal GDP
  fade:true      // linearly fade g1 → gT across stage 1
};

/* CAPM cost of equity */
function costOfEquity(beta,rf,erp){return rf+beta*erp}

/* WACC — uses net debt/equity from the universe as the leverage proxy */
function wacc(tk,a){
  const s=U[tk];
  const ke=costOfEquity(s.beta,a.rf,a.erp);
  const dE=Math.max(0,s.de||0);           // debt / equity
  const wE=1/(1+dE), wD=dE/(1+dE);
  const kd=a.costDebt*(1-a.taxRate/100);
  return ke*wE+kd*wD;
}

/* ---------------------------------------------------------------
   VALUATION ROUTER — the method must fit the business.

   Non-financials  → two-stage free-cash-flow DCF (enterprise value)
   Banks/financials→ justified price-to-book from residual income:
                     P/B = (ROE − g) / (Ke − g)
   Loss-makers     → no intrinsic model offered; say so honestly.

   Running an EV/FCF DCF on a bank is a category error: for a bank,
   debt is raw material rather than financing, so "free cash flow"
   and "net debt" carry no meaning. This router exists to prevent it.
   --------------------------------------------------------------- */
function valMethod(tk){
  const s=U[tk];
  if(s.isFin) return s.eps?'PB':'NONE';
  if(!s.fcf||s.fcf<=0) return 'NONE';
  return 'DCF';
}

/* Two-stage residual income for banks.

   A bank creates value only where ROE exceeds cost of equity, and no
   bank sustains an abnormal ROE forever — competition erodes it. So we
   fade ROE from today's level to a sustainable terminal level, accrue
   the excess return on a book value that compounds at ROE × retention,
   and capitalise whatever excess remains at the end.

   V0 = B0 + Σ (ROEt − Ke)·B(t−1)/(1+Ke)^t + terminal excess / (1+Ke)^N

   A single-stage Gordon P/B is the common shortcut here, but it divides
   by (Ke − g) and so explodes or collapses on assumptions nobody can
   pin down — and it cannot express the one thing that actually decides
   a bank's multiple: how long the excess return lasts.                */
/* Terminal ROE, auto-derived unless the analyst overrides it.
   A moat decays but rarely vanishes: we keep 80% of today's excess
   franchise, with a floor just above cost of equity.               */
function autoTerminalROE(tk,a){
  const ke=costOfEquity(U[tk].beta,a.rf,a.erp);
  return Math.max(ke+1.5, roeOf(tk)*0.8);
}
function residualIncome(tk,a){
  const s=U[tk];
  if(!s.bvps)return null;
  const ke=costOfEquity(s.beta,a.rf,a.erp)/100;
  const g=(a.gBank!=null?a.gBank:a.gT)/100;
  const roe0=roeOf(tk)/100;
  const roeT=(a.roeT!=null?a.roeT:autoTerminalROE(tk,a))/100;
  const ret=Math.max(0,Math.min(.95,1-(s.payout||0)/100));   // retention ratio
  const N=Math.max(3,Math.round(a.fadeYrs));
  if(ke<=g)return{error:'Cost of equity ('+(ke*100).toFixed(1)+'%) must exceed terminal growth ('+(g*100).toFixed(1)+'%)'};
  let B=s.bvps, pv=0, rows=[];
  for(let t=1;t<=N;t++){
    const roeT_t=roe0+(roeT-roe0)*t/N;                        // linear fade
    const ri=(roeT_t-ke)*B;                                   // excess return on opening book
    const d=ri/Math.pow(1+ke,t);
    pv+=d;
    rows.push({t,roe:roeT_t*100,bv:B,ri,pv:d});
    B=B*(1+roeT_t*ret);
  }
  const termRI=(roeT-ke)*B/(ke-g);
  const pvTerm=termRI/Math.pow(1+ke,N);
  const perShare=s.bvps+pv+pvTerm;
  const impliedPB=perShare/s.bvps;
  return{method:'PB',perShare,pb:impliedPB,curPB:pbOf(tk),bvps:s.bvps,
    ke:ke*100,roe:roe0*100,roeT:roeT*100,g:g*100,ret:ret*100,N,auto:a.roeT==null,
    pvExcess:pv,pvTerm,termShare:pvTerm/(pv+pvTerm||1),rows,w:ke*100};
}

/* Two-stage FCF DCF for non-financials. Per-share fair value in IDR. */
function dcfCore(tk,a){
  const s=U[tk];
  if(!s.fcf||s.fcf<=0||!s.sh)return null;
  const w=wacc(tk,a)/100, gT=a.gT/100;
  if(w<=gT)return{error:'WACC ('+(w*100).toFixed(1)+'%) must exceed terminal growth ('+a.gT+'%)'};
  let pv=0,fcf=s.fcf,flows=[];
  for(let y=1;y<=a.years;y++){
    const g=a.fade?(a.g1+(a.gT-a.g1)*(y-1)/Math.max(1,a.years-1))/100:a.g1/100;
    fcf*=1+g;
    const d=fcf/Math.pow(1+w,y);
    pv+=d;flows.push({y,g:g*100,fcf,pv:d});
  }
  const tv=fcf*(1+gT)/(w-gT), pvTV=tv/Math.pow(1+w,a.years);
  const ev=pv+pvTV, netDebt=s.nd, eq=ev-netDebt;
  const perShare=eq*1000/s.sh;                       // IDR bn → IDR per share (sh in millions)
  return{method:'DCF',ev,pvExplicit:pv,pvTV,tv,eq,netDebt,perShare,w:w*100,flows,tvShare:pvTV/ev};
}

/* Public entry point used everywhere in the UI */
function dcf(tk,a){
  const m=valMethod(tk);
  if(m==='PB')return residualIncome(tk,a);
  if(m==='DCF')return dcfCore(tk,a);
  return null;
}

/* Reverse valuation — what does the current price already imply?
   DCF names: implied stage-1 FCF growth.
   Bank names: implied sustainable ROE at the current P/B.        */
function reverseDCF(tk,a){
  const m=valMethod(tk);
  if(m==='NONE')return null;
  if(m==='PB'){
    const cur=px(tk,LAST);
    let lo=0,hi=60;
    const f=r=>{const x=residualIncome(tk,{...a,roeT:r});return x&&!x.error?x.perShare:null};
    const flo=f(lo),fhi=f(hi);
    if(flo==null||fhi==null||flo>cur||fhi<cur)return null;
    for(let i=0;i<70;i++){const mid=(lo+hi)/2;const v=f(mid);if(v==null)return null;
      if(v<cur)lo=mid;else hi=mid}
    return (lo+hi)/2;                              // implied sustainable terminal ROE, %
  }
  const cur=px(tk,LAST);
  let lo=-25,hi=45;
  const f=g=>{const r=dcfCore(tk,{...a,g1:g});return r&&!r.error?r.perShare:null};
  const flo=f(lo),fhi=f(hi);
  if(flo==null||fhi==null)return null;
  if(flo>cur||fhi<cur)return null;                // price outside the solvable range
  for(let i=0;i<70;i++){const mid=(lo+hi)/2;const v=f(mid);
    if(v==null)return null;if(v<cur)lo=mid;else hi=mid}
  return (lo+hi)/2;
}

/* Sensitivity grid — fair value across discount rate × terminal growth.
   Works for both methods; for banks the row axis is cost of equity.   */
function sensitivity(tk,a){
  const m=valMethod(tk);
  if(m==='NONE')return null;
  if(m==='PB'){                       // banks: terminal ROE × cost of equity
    const base=autoTerminalROE(tk,a);
    const r0=a.roeT!=null?a.roeT:base;
    const roeAx=[r0-3,r0-1.5,r0,r0+1.5,r0+3];
    const shifts=[-1,-.5,0,.5,1];
    const cur=px(tk,LAST);
    const rows=shifts.map(es=>{
      const cells=roeAx.map(rr=>{const x=residualIncome(tk,{...a,erp:a.erp+es,roeT:rr});
        if(!x||x.error)return null;return{v:x.perShare,up:x.perShare/cur-1}});
      const b=residualIncome(tk,{...a,erp:a.erp+es});
      return{erp:a.erp+es,w:b&&!b.error?b.ke:null,cells};
    });
    return{gTs:roeAx,rows,cur,method:'PB',axisLabel:'Terminal ROE'};
  }
  const gTs=[a.gT-1,a.gT-.5,a.gT,a.gT+.5,a.gT+1];
  const shifts=[-1,-.5,0,.5,1];
  const cur=px(tk,LAST);
  const rows=shifts.map(es=>{
    const cells=gTs.map(g=>{
      const r=dcf(tk,{...a,erp:a.erp+es,gT:g});
      if(!r||r.error)return null;
      return{v:r.perShare,up:r.perShare/cur-1};
    });
    const base=dcf(tk,{...a,erp:a.erp+es});
    return{erp:a.erp+es,w:base&&!base.error?base.w:null,cells};
  });
  return{gTs,rows,cur,method:valMethod(tk)};
}

/* Relative valuation scorecard — where does it sit vs sector and vs itself */
function medOf(sec,fn){const v=TICKERS.filter(t=>U[t].s===sec&&fn(t)>0).map(fn).sort((a,b)=>a-b);
  if(!v.length)return null;const m=Math.floor(v.length/2);return v.length%2?v[m]:(v[m-1]+v[m])/2}
function relVal(tk){
  const s=U[tk];
  const peers=TICKERS.filter(t=>U[t].s===s.s&&t!==tk);
  const secPE=medOf(s.s,peOf),secPB=medOf(s.s,pbOf),secROE=medOf(s.s,roeOf),secDY=medOf(s.s,dyOf);
  const pe=peOf(tk),pb=pbOf(tk);
  return{peers,secPE,secPB,secROE,secDY,
    peDisc:pe>0&&secPE?pe/secPE-1:null,
    pbDisc:pb>0&&secPB?pb/secPB-1:null,
    roeGap:secROE!=null?roeOf(tk)-secROE:null};
}

/* ---------------------------------------------------------------
   Composite scores for the screener. Each is 0-100 and every
   component is documented in the UI — no black boxes.
   --------------------------------------------------------------- */
function fcfYield(t){const m=mcapOf(t);return m>0?U[t].fcf/m*100:0}
function earnYield(t){const p=peOf(t);return p>0?100/p:0}

function zClamp(v,lo,hi){return Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100))}

function valueScore(tk){
  const s=U[tk],pe=peOf(tk),pb=pbOf(tk);
  if(pe<=0)return null;                          // loss-making: not scorable on earnings
  const ey=zClamp(earnYield(tk),3,18);
  const fy=s.isFin?ey:zClamp(fcfYield(tk),0,15); // banks: FCF undefined, lean on earnings yield
  const pbz=zClamp(4-Math.min(4,pb),0,3.5);
  const dyz=zClamp(dyOf(tk),0,10);
  return Math.round(ey*.35+fy*.25+pbz*.2+dyz*.2);
}
function qualityScore(tk){
  const s=U[tk];
  const roe=zClamp(roeOf(tk),0,30);
  const lev=s.isFin?60:zClamp(3-Math.min(3,Math.max(0,s.ndE)),0,3); // banks: gearing not comparable, use neutral
  const marg=s.nm>0?zClamp(s.nm,0,30):0;
  const stab=zClamp(s.q,20,90);                             // demo quality flag
  return Math.round(roe*.3+lev*.2+marg*.2+stab*.3);
}
function momentumScore(tk){
  const m1=chg(tk,21),m3=chg(tk,63),m6=chg(tk,126);
  const above50=px(tk,LAST)>ma(tk,50)?1:0, above200=px(tk,LAST)>ma(tk,200)?1:0;
  const raw=zClamp(m1*100,-15,15)*.2+zClamp(m3*100,-25,25)*.3+zClamp(m6*100,-35,35)*.3+(above50*10+above200*10);
  return Math.round(Math.max(0,Math.min(100,raw)));
}
function liquidityScore(tk){return Math.round(zClamp(Math.log10(Math.max(1,U[tk].adv)),0.7,2.9))}

function screenRow(tk){
  const s=U[tk],p=px(tk,LAST);
  const v=valueScore(tk),q=qualityScore(tk),m=momentumScore(tk),l=liquidityScore(tk);
  const composite=(v!=null)?Math.round(v*.4+q*.35+m*.25):null;
  return{tk,name:s.n,sector:s.s,sub:s.sub,price:p,mcap:mcapOf(tk),isFin:s.isFin,
    pe:peOf(tk),pb:pbOf(tk),roe:roeOf(tk),dy:dyOf(tk),ndE:s.ndE,rg:s.rg,eg:s.eg,nm:s.nm,adv:s.adv,soe:s.soe,
    ey:earnYield(tk),fy:fcfYield(tk),
    d1:chg(tk,1),m1:chg(tk,21),m3:chg(tk,63),ytd:px(tk,LAST)/px(tk,ytdIdx())-1,
    from52h:p/hi52(tk)-1,vol:volAnn(tk,126),
    v,q,m,l,composite};
}

/* ---------------- formatting ---------------- */
function fN(v,d){return v==null||isNaN(v)?'—':(+v).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function fIDR(v){const s=v<0?'−':'';v=Math.abs(v);

function fP(v,d){if(v==null||isNaN(v))return'—';const s=v<0?'−':'+';return s+Math.abs(v*100).toFixed(d==null?1:d)+'%'}
function fPU(v,d){return v==null||isNaN(v)?'—':(v*100).toFixed(d==null?1:d)+'%'}
function fX(v,d){return v==null||isNaN(v)||v<=0?'—':v.toFixed(d==null?1:d)+'x'}
function cl(v){return v>1e-9?'up':v<-1e-9?'dn':'fl'}
function ar(v){return v>1e-9?'▲':v<-1e-9?'▼':'·'}
function sg(v,txt){return`<span class="${cl(v)}">${ar(v)} ${txt}</span>`}

/* =====================================================================
   PORTFOLIO ENGINE — self-input transactions, time-weighted return.

   Why time-weighted (TWR) and not (value − money in) ÷ money in:
   the naive formula is distorted the moment you buy twice, because it
   mixes YOUR deposit timing with the MARKET's performance. TWR removes
   the deposits: each day earns r = (V − V₋₁ − F) / (V₋₁ + F), where F
   is that day's net contribution (buys in, sells out), and the days
   chain-link. That is the only return that is fairly comparable to an
   index — it measures the portfolio, not the timing of your funding.
   ===================================================================== */
const PORT_KEY='idx_port_v1';
let PORT={tx:[],feeBuy:0.15,feeSell:0.25};
function loadPort(){try{const r=localStorage.getItem(PORT_KEY);if(r)PORT={...PORT,...JSON.parse(r)}}catch(e){}}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='portfolio_'+APP.asof+'.json';a.click()}
function importPort(file){const fr=new FileReader();
  fr.onload=()=>{try{PORT={...PORT,...JSON.parse(fr.result)};savePort();render()}
    catch(e){alert('Could not read that file — expecting the JSON exported from this terminal.')}};
  fr.readAsText(file)}
function dateIdx(d){for(let i=0;i<=LAST;i++)if(DATES[i]>=d)return i;return -1}
function heldSharesAsOf(tk,d){
  let s=0;
  for(const t of PORT.tx)if(t.tk===tk&&t.d<=d)s+=(t.side==='BUY'?1:-1)*t.lots*100;
  return s}

function portCalc(){
  const tx=PORT.tx.filter(t=>U[t.tk]&&PX[t.tk]).slice().sort((a,b)=>a.d.localeCompare(b.d));
  const skipped=PORT.tx.filter(t=>!U[t.tk]||!PX[t.tk]).map(t=>t.tk);
  if(!tx.length)return{empty:true,skipped};
  const i0=dateIdx(tx[0].d);
  if(i0<0)return{empty:true,skipped};
  const fB=PORT.feeBuy/100,fS=PORT.feeSell/100;
  const ev={};
  for(const t of tx){const i=Math.max(i0,dateIdx(t.d));(ev[i]=ev[i]||[]).push(t)}
  const sh={},avg={};
  let realized=0,fees=0,contrib=0,withdrawn=0,twr=1;
  const V=[],TWRi=[];
  for(let i=i0;i<=LAST;i++){
    let f=0;
    for(const t of (ev[i]||[])){
      const shares=t.lots*100,cash=shares*t.price;
      if(t.side==='BUY'){
        const fee=cash*fB;fees+=fee;
        const cost=cash+fee;
        const prev=sh[t.tk]||0;
        avg[t.tk]=(prev*(avg[t.tk]||0)+cost)/(prev+shares);
        sh[t.tk]=prev+shares;
        contrib+=cost;f+=cost;
      }else{
        const held=sh[t.tk]||0,s2=Math.min(shares,held);
        if(s2<=0)continue;
        const fee=s2*t.price*fS;fees+=fee;
        const proceeds=s2*t.price-fee;
        realized+=proceeds-s2*(avg[t.tk]||0);
        sh[t.tk]=held-s2;
        withdrawn+=proceeds;f-=proceeds;
      }
    }
    let v=0;for(const k in sh)if(sh[k]>0)v+=sh[k]*px(k,i);
    const prev=V.length?V[V.length-1]:0;
    /* End-of-day flow convention: money added today is priced at today's
       levels, so it does not participate in today's return — the correct
       treatment when transactions are entered at their actual price. On a
       day that initiates from zero, the contribution itself is the base,
       which is what books the fee drag into the return. */
    const denom=prev>1e-9?prev:f;
    const r=denom>1e-9?(v-prev-f)/denom:0;
    twr*=(1+r);
    V.push(v);TWRi.push(twr*100);
  }
  const hold=Object.keys(sh).filter(k=>sh[k]>0).map(k=>{
    const val=sh[k]*px(k,LAST),cost=sh[k]*avg[k];
    return{tk:k,shares:sh[k],lots:sh[k]/100,avg:avg[k],last:px(k,LAST),val,cost,upnl:val-cost}});
  const mv=hold.reduce((s,h)=>s+h.val,0),cb=hold.reduce((s,h)=>s+h.cost,0);
  hold.forEach(h=>h.w=mv>0?h.val/mv:0);
  return{empty:false,skipped,i0,V,TWRi,hold,mv,cb,upnl:mv-cb,realized,fees,contrib,withdrawn,twrIncep:twr-1};
}
function portPeriod(pc,days){
  if(!pc||pc.empty)return null;
  const len=pc.TWRi.length;
  const s=days==null?0:Math.max(0,len-1-days);
  const p=pc.TWRi[len-1]/pc.TWRi[s]-1;
  const gi=pc.i0+s;
  const b=MKT.IHSG?MKT.IHSG[LAST]/MKT.IHSG[gi]-1:null;
  return{p,b,active:b==null?null:p-b,startIdx:gi};
}

function methLabelOf(m){return{DCF:'Two-stage FCF DCF',PB:'Residual income (banks)',NONE:'No intrinsic model'}[m]}

function perfTable(tk){
  const wins=[21,63,145,252];                      // 1M, 3M, ~YTD, 12M
  const abs=wins.map(d=>chg(tk,d));
  const idx=wins.map(d=>MKT.IHSG?MKT.IHSG[LAST]/MKT.IHSG[Math.max(0,LAST-d)]-1:null);
  const rel=wins.map((d,i)=>idx[i]==null?null:abs[i]-idx[i]);
  return{abs,idx,rel};
}

/* Report-style prose generated from the numbers on this page — every figure
   in these sentences is computed, not written. */
function posNarrative(tk){
  const s=U[tk],pf=perfTable(tk),rv=relVal(tk);
  const m3=pf.abs[1],rel3=pf.rel[1];
  let out=`${tk} has ${m3>=0?'risen':'fallen'} ${Math.abs(m3*100).toFixed(1)}% over the past three months`;
  if(rel3!=null)out+=`, ${Math.abs(rel3*100).toFixed(1)}pp ${rel3>=0?'ahead of':'behind'} the IHSG`;
  out+='. ';
  const pe=peOf(tk);
  if(pe>0&&rv.secPE){
    out+=`It trades at ${pe.toFixed(1)}x trailing earnings against a ${s.s} median of ${rv.secPE.toFixed(1)}x`;
    if(rv.roeGap!=null)out+=`, with a return on equity ${Math.abs(rv.roeGap).toFixed(1)}pp ${rv.roeGap>=0?'above':'below'} the sector`;
    out+='.';
  }else if(pbOf(tk)>0&&rv.secPB){
    out+=`With no positive earnings, the reference multiple is price-to-book: ${pbOf(tk).toFixed(2)}x against a sector median of ${rv.secPB.toFixed(2)}x.`;
  }
  return out;
}

function valNarrative(tk,a,r,rdcf,meth){
  const s=U[tk],p=px(tk,LAST);
  if(meth==='NONE')
    return `${s.n} has no positive free cash flow, so no intrinsic model is offered here — a DCF on a cash-burning business produces a number, not an answer. The honest approaches are revenue or gross-profit multiples against comparable growth assets, a sum-of-the-parts, or an explicit path-to-profitability scenario. `+posNarrative(tk);
  if(r&&r.error)return r.error;
  if(meth==='PB'){
    const imp=rdcf!=null?rdcf.toFixed(1):null;
    return `We value ${s.n} on a two-stage residual income model — the appropriate framework for a bank, where deposits are raw material rather than financing and free cash flow has no meaning. Fading return on equity from ${r.roe.toFixed(1)}% today to ${r.roeT.toFixed(1)}% over ${r.N} years and discounting the excess over a ${r.ke.toFixed(1)}% cost of equity gives fair value of Rp ${fN(r.perShare)} per share, or ${r.pb.toFixed(2)}x book against the ${r.curPB.toFixed(2)}x the market is paying. `+
    (imp?`The cleaner way to read the gap: at the current price the market is underwriting roughly ${imp}% sustainable ROE beyond the fade period, versus the ${r.roe.toFixed(1)}% delivered today. The investment question is whether the franchise can hold that — the model only states what is being assumed. `:'')+
    `Indonesian bank multiples have persistently run above residual-income values on the argument that a deposit franchise defends excess returns far longer than any modelled fade; treat that as a live debate, not an error in either direction.`;
  }
  // DCF
  let judge='';
  if(rdcf!=null){
    const deliv=Math.max(s.rg||0,s.eg||0);
    if(rdcf<deliv-3)judge=`, an undemanding bar against the ${deliv.toFixed(1)}% the business has recently been delivering`;
    else if(rdcf>deliv+3)judge=`, a demanding bar against the ${deliv.toFixed(1)}% the business has recently been delivering`;
    else judge=`, broadly in line with recent delivery`;
  }
  return `We value ${s.n} on a two-stage free cash flow model: trailing FCF of ${fBn(s.fcf)} grown at ${a.g1}% fading to ${a.gT}% terminal, discounted at a ${r.w.toFixed(1)}% WACC, less net ${s.nd<0?'cash':'debt'} of ${fBn(Math.abs(s.nd))}. That gives fair value of Rp ${fN(r.perShare)} per share, ${fP(r.perShare/p-1)} against the last close. `+
  (rdcf!=null?`Run in reverse, the current price already implies ${rdcf.toFixed(1)}% annual FCF growth over the next five years${judge}. `:'')+
  `Note that ${fPU(r.tvShare,0)} of the modelled value sits in the terminal assumption, so the sensitivity grid below matters more than the point estimate. `+posNarrative(tk);
}

/* Financial highlights: trailing plus two forward years driven by THIS page's
   assumptions — clearly labelled model estimates, not consensus. */
function finHighlights(tk,a,r,meth){
  const s=U[tk],p=px(tk,LAST);
  const rows=[];
  const add=(l,vals,fmt)=>rows.push({l,vals,fmt});
  if(meth==='DCF'&&r&&!r.error&&s.eps){
    const g1=r.flows[0].g/100,g2=r.flows[1].g/100;
    const e0=s.eps,e1=e0*(1+g1),e2=e1*(1+g2);
    const d0=s.dps,pr=(s.payout||0)/100;
    add('EPS (Rp)',[e0,e1,e2],v=>fN(v,0));
    add('EPS growth',[s.eg/100,g1,g2],v=>fP(v,1));
    add('P/E (x)',[p/e0,p/e1,p/e2],v=>v.toFixed(1));
    add('DPS (Rp)',[d0,e1*pr,e2*pr],v=>fN(v,0));
    add('Dividend yield',[d0/p,e1*pr/p,e2*pr/p],v=>fPU(v,1));
    const f0=s.fcf,f1=r.flows[0].fcf,f2=r.flows[1].fcf;
    add('FCF (IDR bn)',[f0,f1,f2],v=>fN(v,0));
    add('FCF yield',[f0,f1,f2].map(v=>v/mcapOf(tk)),v=>fPU(v,1));
    add('ROE',[s.roe/100,s.roe/100,s.roe/100],v=>fPU(v,1));
  }else if(meth==='PB'&&r&&!r.error){
    const b0=s.bvps,ret=r.ret/100;
    const r1=r.rows[0],r2=r.rows[1];
    const e0=s.eps,e1=r1.roe/100*r1.bv,b1=r1.bv*(1+r1.roe/100*ret);
    const e2=r2.roe/100*r2.bv,b2=r2.bv*(1+r2.roe/100*ret);
    const pr=(s.payout||0)/100;
    add('EPS (Rp)',[e0,e1,e2],v=>fN(v,0));
    add('BVPS (Rp)',[b0,b1,b2],v=>fN(v,0));
    add('P/E (x)',[p/e0,p/e1,p/e2],v=>v.toFixed(1));
    add('P/B (x)',[p/b0,p/b1,p/b2],v=>v.toFixed(2));
    add('DPS (Rp)',[s.dps,e1*pr,e2*pr],v=>fN(v,0));
    add('Dividend yield',[s.dps/p,e1*pr/p,e2*pr/p],v=>fPU(v,1));
    add('ROE',[r.roe/100,r1.roe/100,r2.roe/100],v=>fPU(v,1));
  }else{
    add('P/B (x)',[pbOf(tk)],v=>v>0?v.toFixed(2):'—');
    add('Revenue growth',[s.rg/100],v=>fP(v,1));
    add('Net margin',[s.nm/100],v=>fPU(v,1));
    add('Net cash / (debt), IDR bn',[-s.nd],v=>fN(v,0));
  }
  return rows;
}

  const axis=meth==='PB'?'Ke \\ term ROE':'WACC \\ g';

  return `<div class="sg" style="grid-template-columns:96px repeat(5,1fr);margin-top:12px">
   <div class="ax">${axis}</div>${sens.gTs.map(g=>`<div class="ax">${g.toFixed(meth==='PB'?1:2)}%</div>`).join('')}

  <button class="btn" style="border:1px solid var(--ln);border-radius:4px;padding:5px 11px;font-size:11px;color:var(--t2)" onclick="editCoverage(null)">+ Initiate</button>
  <button class="btn" style="border:1px solid var(--ln);border-radius:4px;padding:5px 11px;font-size:11px;color:var(--t2)" onclick="exportCoverage()">Export JSON</button>
  <label class="btn" style="border:1px solid var(--ln);border-radius:4px;padding:5px 11px;font-size:11px;color:var(--t2);cursor:pointer">Import<input type="file" accept="application/json" style="display:none" onchange="if(this.files[0])importCoverage(this.files[0])"></label>
 </div></div>
<div class="g" style="grid-template-columns:repeat(5,1fr);margin-bottom:11px">
 ${kc('Names covered',list.length,'&nbsp;','Every name where you have published a rating and thesis.')}
 ${kc('Buy / Hold / Sell',`<span class="up">${byR('BUY')}</span> / <span class="ac">${byR('HOLD')}</span> / <span class="dn">${byR('SELL')}</span>`,'&nbsp;','Rating distribution. A book that is 100% BUY is a signal you are not being honest with yourself.')}
 ${kc('Avg upside to target',list.length?fP(list.reduce((s,x)=>s+x.up,0)/list.length):'—','&nbsp;','Mean distance from last price to your target across the book.')}
 ${kc('Reviews overdue',list.filter(x=>x.overdue).length,'&nbsp;','A thesis you have not revisited is a thesis you no longer hold deliberately.',list.filter(x=>x.overdue).length?'dn':'up')}
 ${kc('Avg conviction',list.length?(list.reduce((s,x)=>s+(x.conv||0),0)/list.length).toFixed(1)+' / 5':'—','&nbsp;','Your own stated confidence. Track whether high-conviction calls actually work better than low.')}
</div>
<div class="pnl" style="margin-bottom:11px"><div class="tw"><table class="t"><thead><tr>
 <th class="l">Ticker</th><th class="l">Sector</th><th class="l">Rating</th><th>Price</th><th>Target</th><th>Upside</th><th>Conviction</th><th class="l">Initiated</th><th class="l">Next review</th><th></th></tr></thead><tbody>
 ${list.sort((a,b)=>b.up-a.up).map(x=>`<tr class="ck" onclick="openCo('${x.tk}')">
  <td class="l"><span class="tk">${x.tk}</span> <span class="fa" style="font-size:10px">${U[x.tk]?U[x.tk].n.slice(0,22):''}</span></td>
  <td class="l mu" style="font-size:10.5px">${U[x.tk]?U[x.tk].s:'—'}</td>
  <td class="l"><span class="bg ${x.rating==='BUY'?'b-up':x.rating==='SELL'?'b-dn':'b-ac'}">${x.rating}</span></td>
  <td class="n">${fN(x.price)}</td><td class="n">${fN(x.target)}</td>
  <td class="n ${cl(x.up)}">${fP(x.up)}</td>
  <td class="n mu">${'●'.repeat(x.conv||0)}${'○'.repeat(5-(x.conv||0))}</td>
  <td class="l mu">${fmtD(x.date)}</td>
  <td class="l ${x.overdue?'dn':'mu'}">${x.review==='OVERDUE'?'OVERDUE':fmtD(x.review)}</td>
  <td><button class="btn" style="font-size:10px;color:var(--t3)" onclick="event.stopPropagation();editCoverage('${x.tk}')">Edit</button></td></tr>`).join('')
  ||'<tr><td colspan="10" class="l nt" style="padding:20px">No coverage yet. Click Initiate to write your first note.</td></tr>'}
</tbody></table></div></div>
${list.map(x=>`<div class="pnl" style="margin-bottom:9px"><div class="ph">
 <h3>${x.tk} — ${U[x.tk]?U[x.tk].n:''}</h3>
 <span class="bg ${x.rating==='BUY'?'b-up':x.rating==='SELL'?'b-dn':'b-ac'}">${x.rating}</span>
 <span class="s">Target ${fN(x.target)} · ${fP(x.up)} · initiated ${fmtD(x.date)}</span></div>
 <div class="pb"><div style="font-size:12.5px;line-height:1.65">${x.thesis}</div>
 <div class="g" style="grid-template-columns:1fr 1fr 1fr;margin-top:11px">
  <div><div class="sect" style="margin-top:0">Bull</div><div class="nt" style="font-size:11.5px">${x.bull||'—'}</div></div>
  <div><div class="sect" style="margin-top:0">Bear</div><div class="nt" style="font-size:11.5px">${x.bear||'—'}</div></div>
  <div><div class="sect" style="margin-top:0;color:var(--ac)">Would change my mind</div><div class="nt" style="font-size:11.5px;color:var(--ac)">${x.change||'—'}</div></div>
 </div></div></div>`).join('')}
<div class="warn">The discipline that matters: write the invalidation before you need it. A note without a stated "what would change my mind" is an opinion, not a thesis — and it is the field that separates an analyst from a commentator.</div>`;
}
function editCoverage(tk){
  const isNew=!tk;const c=tk?COVERAGE[tk]:{};
  const opts=TICKERS.filter(t=>isNew?!COVERAGE[t]:true);
  $('#dwT').textContent=isNew?'Initiate coverage':`Edit — ${tk}`;
  $('#dwB').innerHTML=`
  <div class="sect">Security</div>
  <select id="cvTk" style="width:100%" ${isNew?'':'disabled'}>${opts.map(t=>`<option value="${t}" ${t===tk?'selected':''}>${t} — ${U[t].n}</option>`).join('')}</select>
  <div class="g" style="grid-template-columns:1fr 1fr 1fr;margin-top:11px">
   <div><div class="sect" style="margin-top:0">Rating</div><select id="cvR" style="width:100%">${['BUY','HOLD','SELL'].map(r=>`<option ${c.rating===r?'selected':''}>${r}</option>`).join('')}</select></div>
   <div><div class="sect" style="margin-top:0">Target price (IDR)</div><input id="cvT" type="number" value="${c.target||''}" style="width:100%"></div>
   <div><div class="sect" style="margin-top:0">Conviction (1-5)</div><input id="cvC" type="number" min="1" max="5" value="${c.conv||3}" style="width:100%"></div>
  </div>
  <div class="g" style="grid-template-columns:1fr 1fr;margin-top:11px">
   <div><div class="sect" style="margin-top:0">Date</div><input id="cvD" type="date" value="${c.date||APP.asof}" style="width:100%"></div>
   <div><div class="sect" style="margin-top:0">Next review</div><input id="cvRv" type="date" value="${c.review&&c.review!=='OVERDUE'?c.review:''}" style="width:100%"></div>
  </div>
  <div class="sect">Thesis — what is the market missing?</div>
  <textarea id="cvTh" rows="6" placeholder="The core argument in your own words. What do you believe that the current price does not reflect, and why?">${c.thesis||''}</textarea>
  <div class="sect">Bull case</div><textarea id="cvB" rows="3" placeholder="What has to go right.">${c.bull||''}</textarea>
  <div class="sect">Bear case</div><textarea id="cvBr" rows="3" placeholder="What could go wrong — argue against yourself properly.">${c.bear||''}</textarea>
  <div class="sect" style="color:var(--ac)">What would change my mind</div>
  <textarea id="cvCh" rows="3" placeholder="A specific, observable event or number. Not 'if the price falls' — that is not analysis.">${c.change||''}</textarea>
  <div style="display:flex;gap:9px;margin-top:14px">
   <button class="btn" style="background:var(--ac);color:#111;border-radius:4px;padding:8px 16px;font-weight:600;font-size:12px" onclick="saveCoverageForm(${isNew?'null':`'${tk}'`})">Save note</button>
   ${!isNew?`<button class="btn" style="border:1px solid var(--ln);border-radius:4px;padding:8px 14px;font-size:12px;color:var(--dn)" onclick="if(confirm('Delete coverage of ${tk}?')){deleteCoverage('${tk}');closeDw();render()}">Delete</button>`:''}
   <button class="btn" style="border:1px solid var(--ln);border-radius:4px;padding:8px 14px;font-size:12px;color:var(--t2);margin-left:auto" onclick="closeDw()">Cancel</button>
  </div>
  <div class="nt" style="margin-top:14px">Saved in this browser. Use Export JSON on the Coverage tab to keep a copy — that file is your body of work and it should not live only in a browser cache.</div>`;
  $('#dw').classList.add('open');
}
function saveCoverageForm(tk){
  const t=tk||$('#cvTk').value;
  const target=+$('#cvT').value;
  if(!target){alert('A target price is required — a rating without a number is not a call.');return}
  const th=$('#cvTh').value.trim();
  if(th.length<40){alert('Write a real thesis. A sentence or two is not a research note — this is the field a hiring manager will read first.');return}
  upsertCoverage(t,{rating:$('#cvR').value,target,conv:+$('#cvC').value,date:$('#cvD').value||APP.asof,
    review:$('#cvRv').value||'',thesis:th,bull:$('#cvB').value.trim(),bear:$('#cvBr').value.trim(),change:$('#cvCh').value.trim()});
  closeDw();state.co=t;render();
}
function closeDw(){$('#dw').classList.remove('open')}

/* ================= TAB 5 — NEWS ================= */
function renderNews(){
  const cats=['ALL',...new Set(NEWS.map(n=>n.cat))];
  let list=NEWS.slice().sort((a,b)=>b.d.localeCompare(a.d));
  if(state.newsFilter==='COVERAGE'){const c=Object.keys(COVERAGE);list=list.filter(n=>n.tk&&n.tk.some(t=>c.includes(t)))}
  else if(state.newsFilter!=='ALL')list=list.filter(n=>n.cat===state.newsFilter);
  $('#p-news').innerHTML=`
<div class="hd"><h1>News</h1><span class="sub">${APP.dataMode==='LIVE'?'Live feed via idx_data.json':'Demo headlines — run the fetch script for live news'} · ${list.length} items</span></div>
<div class="fb">
 <div class="seg">${['ALL','COVERAGE',...cats.filter(c=>c!=='ALL')].map(c=>`<button class="${state.newsFilter===c?'on':''}" onclick="state.newsFilter='${c}';render()">${c==='COVERAGE'?'My coverage':c}</button>`).join('')}</div>
 <span class="nt" style="margin-left:auto">Click a ticker chip to open the company view</span>
</div>
<div class="g" style="grid-template-columns:8fr 4fr">
 <div class="pnl"><div class="ph"><h3>Headlines</h3><span class="s">${APP.dataMode==='LIVE'?APP.source:'Synthetic — clearly labelled'}</span></div><div class="pb t">
  ${list.map(n=>`<div class="nw"><div class="dt">${fmtD(n.d)}</div><div class="bd">
   ${n.url?`<a href="${n.url}" target="_blank" rel="noopener"><div class="h">${n.t}</div></a>`:`<div class="h">${n.t}</div>`}
   <div class="m"><span class="bg b-mu">${n.cat||'News'}</span><span>${n.src||''}</span>
   ${(n.tk||[]).map(t=>U[t]?`<span class="chip" onclick="openCo('${t}')">${t}${COVERAGE[t]?' ★':''}</span>`:'').join('')}</div>
  </div></div>`).join('')||'<div class="pb nt">Nothing matches this filter.</div>'}
 </div></div>
 <div class="g" style="align-content:start;gap:11px">
  ${pnl('How to make this live',`<div class="pb"><div class="nt" style="line-height:1.75">
   A page opened from your own disk cannot fetch news sites directly — browsers block it, and news sites do not permit it.<br><br>
   The included <b style="color:var(--tx)">fetch_idx_data.py</b> solves this: run it and it writes <b style="color:var(--tx)">idx_data.json</b> next to this file with real prices and headlines. Reload and the badge in the top bar turns green.<br><br>
   Schedule it once a day after the 15:00 WIB close and the terminal stays current with no further work.
  </div></div>`,'Adapter design')}
  ${pnl('Coverage mentions',`<div class="pb t">${Object.keys(COVERAGE).filter(t=>U[t]).map(t=>{const c=NEWS.filter(n=>(n.tk||[]).includes(t)).length;
    return`<div class="st" style="padding:7px 13px"><span class="k"><span class="tk" onclick="openCo('${t}')">${t}</span></span><span class="n ${c?'':'fa'}">${c} ${c===1?'mention':'mentions'}</span></div>`}).join('')||'<div class="pb nt">No coverage yet.</div>'}</div>`)}
 </div>
</div>`;
}

/* ================= ROUTING ================= */
function render(){
  if(!TICKERS.includes(state.co))state.co=TICKERS[0];
  document.querySelectorAll('.pg').forEach(e=>e.classList.remove('on'));
  $('#p-'+state.pg).classList.add('on');
  document.querySelectorAll('.nv').forEach(e=>e.classList.toggle('on',e.dataset.p===state.pg));
  ({market:renderMarket,screen:renderScreen,company:renderCompany,watch:renderWatch,port:renderPort,coverage:renderCoverage,news:renderNews})[state.pg]();
  renderTicker();
  $('#navNote').innerHTML=`Base currency IDR<br>Timezone Asia/Jakarta<br>Prices end-of-day<br><br><b style="color:var(--t2)">${APP.dataMode==='LIVE'?'Live data · '+TICKERS.length+' names':'Demo dataset'}</b><br>${APP.dataMode==='LIVE'?(APP.generated||'via idx_data.json')+((APP.dropped&&APP.dropped.length)?'<br><span style="color:var(--ac)">'+APP.dropped.length+' dropped: no full history</span>':''):'Run fetch_idx_data.py<br>for real market data'}`;
}
function boot(){
  const m=$('#modeBadge');
  if(APP.dataMode==='LIVE'){m.className='mode live';m.textContent='Live';
    m.title=`Real end-of-day data — ${APP.loaded||0} tickers as of ${APP.asof}. Source: ${APP.source}.`+((APP.dropped&&APP.dropped.length)?` Dropped for incomplete history: ${APP.dropped.join(', ')}.`:'')+' Not real time.'}
  else{m.className='mode demo';m.textContent='Demo';
    m.title='All prices, fundamentals and headlines on this screen are synthetic demonstration data. No figure represents actual market information. Run fetch_idx_data.py to load real data.'}
  $('#asof').innerHTML=`As of ${fmtDL(APP.asof)}<br>${APP.dataMode==='LIVE'?(APP.embedded?'Snapshot baked at fetch time':'Delayed / end-of-day'):'Demonstration data'}`;
  /* When served over HTTP with a fetched idx_data.json, poll for a fresher file
     every 15 minutes — pairs with `python fetch_idx_data.py --loop 15`. */
  if(APP.dataMode==='LIVE'&&!APP.embedded&&!APP._poll){
    APP._poll=setInterval(async()=>{try{
      const r=await fetch('idx_data.json',{cache:'no-store'});if(!r.ok)return;
      const j=await r.json();
      if(j.generated&&j.generated!==APP.generated){applyRealData(j);$('#ticker').dataset.built='';render()}
    }catch(e){}},9e5);
  }
  chartInit();render();
}
document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>{state.pg=b.dataset.p;render()});
$('#dwX').onclick=closeDw;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDw()});
$('#themeBtn').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=t;$('#themeBtn').textContent=t==='dark'?'Light':'Dark';chartInit();render()};
/* Manual data load — required when the page is opened over file://,
   where browsers refuse to fetch neighbouring files. */
$('#dataFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{try{applyRealData(JSON.parse(fr.result));boot();}
    catch(err){alert('Could not read that file. Expecting idx_data.json produced by fetch_idx_data.py.')}};
  fr.readAsText(f);
});
loadCoverage();loadPort();loadWatch();
loadRealData().then(boot);

</script>
</body>
</html>
