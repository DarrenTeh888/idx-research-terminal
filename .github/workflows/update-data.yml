name: Update IDX data

on:
  push:
    branches: [main]
    paths-ignore:
      - 'idx_data.json'
  schedule:
    - cron: "20 2 * * 1-5"
    - cron: "20 5 * * 1-5"
    - cron: "20 9 * * 1-5"
  repository_dispatch:
    types: [refresh-data]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: idx-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance feedparser requests

      - name: Fetch data
        run: python fetch_idx_data.py

      - name: Commit if the data actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add idx_data.json
          git add idx-research-terminal-LIVE.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No change — nothing to commit."
          else
            git commit -m "Data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main
            git push
          fi

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
